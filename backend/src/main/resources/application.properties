# ATS Resume Analyzer Configuration

# Server configurations
server.port=8080
server.servlet.context-path=/api

# Database Configuration (MySQL)
# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ats_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Enable logging details
logging.level.com.ats.analyzer=INFO
logging.level.org.springframework.web=INFO

# JWT Security Configurations (using a robust 256-bit base64 secret)
ats.jwt.secret=${ATS_JWT_SECRET:dGhlLXNhZmUtc2VjdXJlLWtleS1mb3ItYXRzLW5leHVzLWFwcGxpY2F0aW9uLXNlY3VyaXR5LTIwMjY=}
ats.jwt.expiration=86400000

